openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: >-
    Train status tracker API — proxies to multiple train status data sources
    (Paytm, Goibibo, RailYatri, WhereIsMyTrain, EaseMyTrip, RailRadar) with
    automatic failover across providers.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: trains
    description: Train status operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /trains:
    get:
      operationId: getTrainCatalog
      tags: [trains]
      summary: Get the full train catalog
      description: Returns the full list of trains (number + name). Pulled from the official NTES train list and cached server-side (default TTL 2h).
      responses:
        "200":
          description: Train catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainCatalogResponse"

  /trains/search:
    get:
      operationId: searchTrains
      tags: [trains]
      summary: Duck-typed fuzzy search over the train catalog
      description: Returns the best-matching trains for a query (number prefix, name substring, or fuzzy subsequence), ranked best-first.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            maxLength: 64
          description: Search query (e.g. 229, rajdhani, mumbai rajdhani)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Maximum number of results (default 10)
      responses:
        "200":
          description: Matching trains
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainSearchResponse"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trains/runs:
    get:
      operationId: getTrainRuns
      tags: [trains]
      summary: Get the train's recent and upcoming run dates
      description: Probes the data provider across the last 3 weeks to derive the train's running-weekday pattern, then returns the last 3 departure dates up to today plus the next upcoming run.
      parameters:
        - name: train_number
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{5}$'
          description: Train number (e.g. 22943)
      responses:
        "200":
          description: Train run dates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainRunsResponse"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Upstream error from data provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trains/status:
    get:
      operationId: getTrainStatus
      tags: [trains]
      summary: Get train running status
      description: Returns live running status for a train on a given departure date, including station-by-station schedule, delay, and current position. Proxies to Paytm trains data.
      parameters:
        - name: train_number
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{5}$'
          description: Train number (e.g. 22943)
        - name: departure_date
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{8}$'
          description: Departure date in YYYYMMDD format (e.g. 20260801)
      responses:
        "200":
          description: Train status response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainStatusResponse"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Train not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Upstream error from data provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    TrainEntry:
      type: object
      description: A single train in the catalog (number + name)
      properties:
        number:
          type: string
          description: Train number (e.g. 22943)
        name:
          type: string
          description: Train name (e.g. Indore Intercity SF Express)
      required:
        - number
        - name

    TrainCatalogResponse:
      type: object
      properties:
        trains:
          type: array
          items:
            $ref: "#/components/schemas/TrainEntry"
      required:
        - trains

    TrainSearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/TrainEntry"
      required:
        - results

    TrainRunsResponse:
      type: object
      description: Recent and upcoming run dates for a train
      properties:
        train_number:
          type: string
        runs:
          type: array
          items:
            type: string
          description: Departure dates (YYYYMMDD) of the last 3 runs up to today plus the next upcoming run, ascending. Empty when no runs could be determined.
      required:
        - train_number
        - runs

    StationStatus:
      type: object
      description: Running status at a single station
      properties:
        station_code:
          type: string
        station_name:
          type: string
        scheduled_arrival:
          type: ["string", "null"]
          description: Scheduled arrival time (HH:MM)
        actual_arrival:
          type: ["string", "null"]
          description: Actual/expected arrival time (HH:MM)
        scheduled_departure:
          type: ["string", "null"]
          description: Scheduled departure time (HH:MM)
        actual_departure:
          type: ["string", "null"]
          description: Actual/expected departure time (HH:MM)
        delay_minutes:
          type: ["number", "null"]
          description: Delay in minutes (positive = late)
        distance_from_source:
          type: ["number", "null"]
          description: Distance from source station in km
        platform:
          type: ["string", "null"]
          description: Platform number
        halt_minutes:
          type: ["number", "null"]
          description: Halt duration in minutes
        has_departed:
          type: boolean
          description: Whether the train has already departed this station
        is_current:
          type: boolean
          description: Whether this is the train's current/last known position
        day:
          type: number
          description: Journey day (1 = departure day)
      required:
        - station_code
        - station_name
        - has_departed
        - is_current
        - day

    TrainStatusResponse:
      type: object
      description: Full train running status
      properties:
        train_number:
          type: string
        train_name:
          type: string
        departure_date:
          type: string
          description: Date in YYYYMMDD format
        source_station_code:
          type: string
        source_station_name:
          type: string
        destination_station_code:
          type: string
        destination_station_name:
          type: string
        current_station_code:
          type: ["string", "null"]
          description: Code of the station where the train currently is / last departed
        current_station_name:
          type: ["string", "null"]
        current_delay_minutes:
          type: ["number", "null"]
          description: Current delay in minutes
        status_message:
          type: ["string", "null"]
          description: Human-readable status summary from data provider
        last_updated:
          type: ["string", "null"]
          description: ISO 8601 timestamp of when the status was last refreshed
        stations:
          type: array
          items:
            $ref: "#/components/schemas/StationStatus"
      required:
        - train_number
        - train_name
        - departure_date
        - source_station_code
        - source_station_name
        - destination_station_code
        - destination_station_name
        - stations
