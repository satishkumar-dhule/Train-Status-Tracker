[workspace]
resolver = "2"
members = [
    "crates/api-server",
    "crates/cache",
    "crates/config",
    "crates/contract",
    "crates/logging",
    "crates/mapper",
    "crates/orchestrator",
    "crates/provider-core",
    "crates/provider-confirmtkt",
    "crates/provider-easemytrip",
    "crates/provider-erail",
    "crates/provider-etrain",
    "crates/provider-goibibo",
    "crates/provider-http",
    "crates/provider-indianrailapi",
    "crates/provider-ntes",
    "crates/provider-paytm",
    "crates/provider-railbeeps",
    "crates/provider-railmitra",
    "crates/provider-railradar",
    "crates/provider-railyatri",
    "crates/provider-redrail",
    "crates/provider-runningstatus",
    "crates/provider-trainspnrstatus",
    "crates/provider-wimt",
    "crates/qos",
    "crates/rate-limit",
    "crates/runs",
    "crates/telemetry",
    "crates/trains-data",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rail Saarthi train status tracker — Rust backend"

# Dependencies are added to [workspace.dependencies] as later slices land them
# (axum, tokio, reqwest, serde, opentelemetry, tracing, redis, ...).
[workspace.dependencies]


