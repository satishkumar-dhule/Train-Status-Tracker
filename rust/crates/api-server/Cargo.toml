[package]
name = "tt-api-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "axum app, routes, middleware, main binary"

[dependencies]
axum = "0.8"
chrono = "0.4.45"
http = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["cors", "trace", "catch-panic"] }
tracing = "0.1.44"
tt-config = { version = "0.1.0", path = "../config" }
tt-contract = { version = "0.1.0", path = "../contract" }
tt-logging = { version = "0.1.0", path = "../logging" }
tt-telemetry = { version = "0.1.0", path = "../telemetry" }

[dev-dependencies]
http-body-util = "0.1.4"
tower = { version = "0.5.3", features = ["util"] }
