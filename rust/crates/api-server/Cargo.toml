[package]
name = "tt-api-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "axum app, routes, middleware, main binary"

[dependencies]
axum = "0.8"
chrono = "0.4.45"
http = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["cors", "trace", "catch-panic"] }
tracing = "0.1.44"
tt-cache = { version = "0.1.0", path = "../cache" }
tt-config = { version = "0.1.0", path = "../config" }
tt-contract = { version = "0.1.0", path = "../contract" }
tt-logging = { version = "0.1.0", path = "../logging" }
tt-mapper = { version = "0.1.0", path = "../mapper" }
tt-orchestrator = { version = "0.1.0", path = "../orchestrator" }
tt-provider-core = { version = "0.1.0", path = "../provider-core" }
tt-provider-easemytrip = { version = "0.1.0", path = "../provider-easemytrip" }
tt-provider-goibibo = { version = "0.1.0", path = "../provider-goibibo" }
tt-provider-http = { version = "0.1.0", path = "../provider-http" }
tt-provider-paytm = { version = "0.1.0", path = "../provider-paytm" }
tt-provider-railradar = { version = "0.1.0", path = "../provider-railradar" }
tt-provider-railyatri = { version = "0.1.0", path = "../provider-railyatri" }
tt-provider-wimt = { version = "0.1.0", path = "../provider-wimt" }
tt-qos = { version = "0.1.0", path = "../qos" }
tt-rate-limit = { version = "0.1.0", path = "../rate-limit" }
tt-runs = { version = "0.1.0", path = "../runs" }
tt-telemetry = { version = "0.1.0", path = "../telemetry" }
tt-trains-data = { version = "0.1.0", path = "../trains-data" }
url = "2.5.8"

[dev-dependencies]
async-trait = "0.1.89"
http-body-util = "0.1.4"
tower = { version = "0.5.3", features = ["util"] }
tt-cache = { version = "0.1.0", path = "../cache", features = ["testkit"] }
tt-provider-http = { version = "0.1.0", path = "../provider-http", features = ["testkit"] }
