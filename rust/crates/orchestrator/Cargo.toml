[package]
name = "tt-orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "fetch_status_with_failover: unanimity-404, 502, QoS cooldown force-try"

[dependencies]
tt-mapper = { version = "0.1.0", path = "../mapper" }
tt-provider-confirmtkt = { version = "0.1.0", path = "../provider-confirmtkt" }
tt-provider-core = { version = "0.1.0", path = "../provider-core" }
tt-provider-easemytrip = { version = "0.1.0", path = "../provider-easemytrip" }
tt-provider-erail = { version = "0.1.0", path = "../provider-erail" }
tt-provider-etrain = { version = "0.1.0", path = "../provider-etrain" }
tt-provider-goibibo = { version = "0.1.0", path = "../provider-goibibo" }
tt-provider-http = { version = "0.1.0", path = "../provider-http" }
tt-provider-indianrailapi = { version = "0.1.0", path = "../provider-indianrailapi" }
tt-provider-ntes = { version = "0.1.0", path = "../provider-ntes" }
tt-provider-paytm = { version = "0.1.0", path = "../provider-paytm" }
tt-provider-railbeeps = { version = "0.1.0", path = "../provider-railbeeps" }
tt-provider-railmitra = { version = "0.1.0", path = "../provider-railmitra" }
tt-provider-railradar = { version = "0.1.0", path = "../provider-railradar" }
tt-provider-railyatri = { version = "0.1.0", path = "../provider-railyatri" }
tt-provider-redrail = { version = "0.1.0", path = "../provider-redrail" }
tt-provider-runningstatus = { version = "0.1.0", path = "../provider-runningstatus" }
tt-provider-trainspnrstatus = { version = "0.1.0", path = "../provider-trainspnrstatus" }
tt-provider-wimt = { version = "0.1.0", path = "../provider-wimt" }
tt-qos = { version = "0.1.0", path = "../qos" }
tt-telemetry = { version = "0.1.0", path = "../telemetry" }
tracing = "0.1.44"

[dev-dependencies]
async-trait = "0.1.77"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
tt-provider-http = { version = "0.1.0", path = "../provider-http", features = ["testkit"] }